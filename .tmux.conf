# =============================================================================
#   Bootstrapping
# =============================================================================

# Auto-install tpm
run-shell 'if [ ! -x ~/.tmux/plugins/tpm/tpm ]; then git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; else exit 0; fi'

# =============================================================================
#   General options
# =============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

if-shell 'command -v zsh >/dev/null 2>&1 && [ -f "$HOME/.zshrc" ]' \
  'set -g default-shell /usr/bin/zsh' \
  'set -g default-shell /bin/bash'

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'
set -g set-titles on
set -g set-titles-string '#{pane_current_command}'
set -g allow-passthrough on

set -g focus-events on

set -g history-limit 50000
set -g display-time 3000

set -g status-keys vi
set -g mode-keys vi

set -s escape-time 0

set -g visual-bell off

set -g monitor-activity on

# =============================================================================
#   Key bindings
# =============================================================================

set -g prefix C-a
bind-key C-a send-prefix

# Vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi o send -X other-end
bind -T copy-mode-vi Escape send -X cancel

bind E setw synchronize-panes
bind Tab last-window
bind = choose-buffer

# =============================================================================
#   Theme (Sonokai andromeda)
# =============================================================================

# Section -> color partition (identical for both palettes):
#   mode / active-tab / hostname => @thm_cyan
#   session                      => @thm_blue
#   inactive tab                 => gray, unchanged
#   time + date                  => @thm_coal
#   battery                      => @thm_slate
#   free / attention             => @thm_orange / @thm_purple
#   bell / reject                => @thm_red
#
# Default palette is truecolor hex; a bare tty (TERM=linux & friends) falls
# back to the fixed 16-color VGA palette.
%if "#{&&:#{!=:#{TERM},linux},#{!=:#{TERM},vt100},#{!=:#{TERM},vt102},#{!=:#{TERM},ansi},#{!=:#{TERM},cons25}}"
set -g @thm_bg      '#2c2e34'
set -g @thm_fg      '#c5c5c9'
set -g @thm_muted   '#7e7e86'
set -g @thm_gray    '#363844'
set -g @thm_blue    '#7aa5ff'
set -g @thm_cyan    '#6dcae8'
set -g @thm_soft    '#e1e3e4'
set -g @thm_coal    '#333648'
set -g @thm_slate   '#3f445b'
set -g @thm_green   '#a7df78'
set -g @thm_orange  '#f39660'
set -g @thm_red     '#fc5d7c'
set -g @thm_purple  '#b39df2'
%else
set -g @thm_bg      'colour0'
set -g @thm_fg      'colour7'
set -g @thm_muted   'colour8'
set -g @thm_gray    'colour8'
set -g @thm_blue    'colour4'
set -g @thm_cyan    'colour6'
set -g @thm_soft    'colour15'
set -g @thm_coal    'colour0'
set -g @thm_slate   'colour8'
set -g @thm_green   'colour2'
set -g @thm_orange  'colour3'
set -g @thm_red     'colour1'
set -g @thm_purple  'colour5'
%endif

# =============================================================================
#   Status bar
# =============================================================================

set -gF status-style 'bg=#{@thm_bg},fg=#{@thm_fg}'
set -g status-left-length 80
set -g status-right-length 160

set -g status-left '#{tmux_mode_indicator}#[bg=#{@thm_blue},fg=#{@thm_bg},bold] #S '
set -g status-right '#(#{SCOUT_DIR}/scripts/status-widget.sh) #[bg=#{@thm_coal},fg=#{@thm_soft}] %H:%M %Y-%m-%d %a #[bg=#{@thm_slate},fg=#{@thm_soft}]#{?#{battery_percentage}, BAT:#{battery_percentage} ,}#[bg=#{@thm_cyan},fg=#{@thm_bg},bold] #H '

set -g window-status-format '#[fg=#{@thm_muted}] #I:#W '
set -g window-status-current-format '#[bg=#{@thm_cyan},fg=#{@thm_bg},bold] #I:#W '
set -gF window-status-last-style 'fg=#{@thm_green},bold'
set -g window-status-separator ''
set -gF window-status-activity-style 'fg=#{@thm_green}'
set -gF window-status-bell-style 'fg=#{@thm_red}'

set -g pane-border-style 'fg=#444444,bg=default'
set -g pane-active-border-style 'fg=#fffafa,bg=default'

set -gF message-style 'bg=#{@thm_gray},fg=#{@thm_fg}'
set -gF message-command-style 'bg=#{@thm_gray},fg=#{@thm_fg}'
set -gF mode-style 'bg=#{@thm_fg},fg=#{@thm_bg}'

# =============================================================================
#   Plugins
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin "tmux-plugins/tmux-battery"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @plugin 'qeesung/tmux-scout'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'Morantron/tmux-fingers'

# =============================================================================
#   Plugin settings
# =============================================================================

# --- tmux-resurrect / tmux-continuum ---
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh "git log"'
set -g @continuum-restore 'on'

# --- tmux-fzf ---
set-environment -g TMUX_FZF_LAUNCH_KEY Q

# --- tmux-fingers ---
set -g @fingers-pattern-0 '\w+'

# --- tmux-scout ---
set -g @scout-status-format '#[fg=#fc5d7c]{W}#[fg=#7e7e86]|#[fg=#f39660]{B}#[fg=#7e7e86]|#[fg=#a7df78]{D}#[fg=#7e7e86]|#[fg=#7aa5ff]{I}'
set -g @scout-status-click-style off

# --- tmux-mode-indicator ---
set -g @mode_indicator_empty_mode_style 'bg=#{@thm_cyan},fg=#{@thm_bg}'
set -g @mode_indicator_prefix_mode_style 'bg=#{@thm_purple},fg=#{@thm_bg}'
set -g @mode_indicator_copy_mode_style  'bg=#{@thm_orange},fg=#{@thm_bg}'
set -g @mode_indicator_sync_mode_style  'bg=#{@thm_red},fg=#{@thm_bg}'

# =============================================================================
#   Initialize tpm (keep last)
# =============================================================================

run-shell '~/.tmux/plugins/tpm/tpm'
